# Run the test suite on a fresh clone for each push and pull request.
#
# The tests use only the committed fixtures under tests/fixtures, so the scans
# are not needed here. opencv-python-headless needs no display, so no extra
# system packages are installed.
#
# 3.11 is the lowest version that pyproject.toml accepts, and 3.13 is the
# version on the development laptop. Windows is in the matrix because the
# laptop runs Windows, and pngio.py handles a Windows path problem that Linux
# does not have.

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}, ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
